<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>屬靈恩賜調查結果</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "微軟雅黑", sans-serif;
            background: linear-gradient(135deg, #e8f5e9 0%, #e3f2fd 50%, #e8f5e9 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            padding: 40px;
        }

        .results-header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 2px solid #e3f2fd;
        }

        .results-header h1 {
            color: #1565c0;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .results-header p {
            color: #757575;
            font-size: 14px;
        }

        .top-gifts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .top-gift-card {
            background: linear-gradient(135deg, #e3f2fd, #bbdefb);
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .top-gift-card .rank {
            font-size: 12px;
            color: #1976d2;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .top-gift-card .gift-name {
            font-size: 20px;
            color: #1565c0;
            font-weight: bold;
            margin: 10px 0;
        }

        .top-gift-card .score {
            font-size: 36px;
            color: #1976d2;
            font-weight: bold;
        }

        .top-gift-card .max-score {
            font-size: 14px;
            color: #757575;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin: 30px 0;
        }

        .results-table th {
            background: #1976d2;
            color: white;
            padding: 12px;
            text-align: left;
            font-size: 14px;
        }

        .results-table td {
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
            font-size: 14px;
        }

        .results-table tr:hover {
            background: #f5f5f5;
        }

        .score-bar {
            height: 20px;
            background: linear-gradient(90deg, #66bb6a, #42a5f5);
            border-radius: 10px;
            transition: width 1s ease;
        }

        .email-section {
            background: #f1f8e9;
            padding: 25px;
            border-radius: 12px;
            margin-top: 40px;
            text-align: center;
        }

        .email-section h3 {
            color: #2e7d32;
            margin-bottom: 15px;
        }

        .email-form {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .email-input {
            padding: 12px 20px;
            border: 2px solid #c8e6c9;
            border-radius: 25px;
            font-size: 16px;
            min-width: 300px;
            outline: none;
            transition: border-color 0.3s;
        }

        .email-input:focus {
            border-color: #66bb6a;
        }

        .email-button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #66bb6a, #43a047);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .email-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }

        .retake-button {
            display: block;
            width: 200px;
            margin: 30px auto 0;
            padding: 12px 30px;
            background: white;
            color: #1976d2;
            border: 2px solid #1976d2;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            transition: all 0.3s;
        }

        .retake-button:hover {
            background: #1976d2;
            color: white;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            .email-input {
                min-width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="results-header">
            <h1>您的屬靈恩賜調查結果</h1>
            <p>根據您的回答，以下是您的屬靈恩賜分析</p>
        </div>

        <div class="top-gifts" id="topGifts">
            <!-- Top 3 gifts will be displayed here -->
        </div>

        <h2 style="color: #1565c0; margin-bottom: 20px;">完整結果</h2>
        
        <table class="results-table">
            <thead>
                <tr>
                    <th>排名</th>
                    <th>恩賜名稱</th>
                    <th>分數</th>
                    <th>百分比</th>
                    <th>分數分佈</th>
                </tr>
            </thead>
            <tbody id="resultsTableBody">
                <!-- Results will be loaded here -->
            </tbody>
        </table>

        <div class="email-section">
            <h3>📧 將結果發送到您的郵箱</h3>
            <div class="email-form">
                <input type="email" class="email-input" id="emailInput" 
                       placeholder="請輸入您的電子郵件地址" required>
                <button class="email-button" onclick="sendEmail()">
                    發送結果
                </button>
            </div>
            <p id="emailMessage" style="margin-top: 10px; color: #2e7d32;"></p>
        </div>

        <a href="quiz.html?page=1" class="retake-button" onclick="resetQuiz()">
            重新填寫問卷
        </a>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/scoring.js"></script>
    <script>
        // Load and display results
        document.addEventListener('DOMContentLoaded', function() {
            const data = calculateResults();
            displayResults(data);
        });

        function displayResults(data) {
            const results = data.results;
            
            // Display top 3 gifts
            const topGiftsContainer = document.getElementById('topGifts');
            const top3 = results.slice(0, 3);
            topGiftsContainer.innerHTML = top3.map((gift, index) => `
                <div class="top-gift-card">
                    <div class="rank">TOP ${index + 1}</div>
                    <div class="gift-name">${gift.name}</div>
                    <div class="score">${gift.score}</div>
                    <div class="max-score">/ ${gift.maxScore} 分</div>
                </div>
            `).join('');
            
            // Display full results table
            const tbody = document.getElementById('resultsTableBody');
            tbody.innerHTML = results.map((gift, index) => `
                <tr>
                    <td>#${index + 1}</td>
                    <td><strong>${gift.name}</strong></td>
                    <td>${gift.score} / ${gift.maxScore}</td>
                    <td>${gift.percentage}%</td>
                    <td>
                        <div style="background: #e0e0e0; border-radius: 10px; height: 20px;">
                            <div class="score-bar" style="width: ${gift.percentage}%"></div>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function sendEmail() {
            const email = document.getElementById('emailInput').value;
            const messageEl = document.getElementById('emailMessage');
            
            if (!email || !email.includes('@')) {
                messageEl.textContent = '請輸入有效的電子郵件地址';
                messageEl.style.color = '#d32f2f';
                return;
            }
            
            // This would use EmailJS or similar service
            // For now, show a placeholder message
            messageEl.textContent = '結果已發送到 ' + email;
